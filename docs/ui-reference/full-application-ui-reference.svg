    <text x="140" y="124" class="t small">Colors</text>
    <circle cx="150" cy="150" r="10" fill="#2E8BFF"/><circle cx="180" cy="150" r="10" fill="#8D66FF"/><circle cx="210" cy="150" r="10" fill="#F3A23A"/><circle cx="240" cy="150" r="10" fill="#25C58B"/><circle cx="270" cy="150" r="10" fill="#EF5D67"/>
    <text x="372" y="124" class="t small">Buttons / Badges</text>
    <rect x="372" y="140" width="78" height="20" rx="7" fill="#2E8BFF"/><rect x="460" y="140" width="92" height="20" rx="7" fill="#18324D"/>
    <rect x="126" y="193" width="458" height="80" rx="10" class="card"/>
