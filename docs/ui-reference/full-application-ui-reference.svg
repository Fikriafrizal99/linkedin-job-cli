    <rect x="420" y="105" width="164" height="168" rx="10" class="card"/>
    <text x="140" y="126" class="t small">Search Criteria</text><text x="434" y="126" class="t small">Collection Progress</text>
    <rect x="140" y="141" width="160" height="24" rx="7" fill="#152A42"/><rect x="310" y="141" width="82" height="24" rx="7" fill="#152A42"/>
    <rect x="140" y="174" width="252" height="24" rx="7" fill="#152A42"/><rect x="140" y="209" width="100" height="26" rx="7" fill="#2E8BFF"/>
    <g fill="#25C58B"><circle cx="436" cy="148" r="4"/><circle cx="436" cy="172" r="4"/><circle cx="436" cy="196" r="4"/><circle cx="436" cy="220" r="4"/></g>
    <g fill="#8799B2"><rect x="447" y="144" width="112" height="7" rx="3"/><rect x="447" y="168" width="102" height="7" rx="3"/><rect x="447" y="192" width="118" height="7" rx="3"/><rect x="447" y="216" width="96" height="7" rx="3"/></g>
    <text x="10" y="-12" class="t body">07. Collect Jobs</text>
