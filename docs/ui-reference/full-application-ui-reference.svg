<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071321"/>
      <stop offset="1" stop-color="#0A1728"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102238"/>
      <stop offset="1" stop-color="#0C1B2D"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".28"/></filter>
    <style>
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#E8F0FA}
      .muted{fill:#8799B2}
      .blue{fill:#2E8BFF}.green{fill:#25C58B}.purple{fill:#8D66FF}.amber{fill:#F3A23A}.red{fill:#EF5D67}
      .panel{fill:url(#panel);stroke:#223A55;stroke-width:1}
      .card{fill:#12263D;stroke:#26425F;stroke-width:1}
      .line{stroke:#29435E;stroke-width:1}
      .tiny{font-size:10px}.small{font-size:12px}.body{font-size:14px}.h2{font-size:18px;font-weight:700}.h1{font-size:26px;font-weight:700}
      .badge{rx:8;ry:8}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="38" y="44" class="t h1">LinkedIn Job CLI — Full UI Reference</text>
  <text x="38" y="70" class="t small muted">Unified dark design system • consistent navigation • end-to-end workflow • source of truth for implementation</text>
  <g transform="translate(1545 25)">
    <circle cx="0" cy="0" r="10" fill="#2E8BFF"/><circle cx="32" cy="0" r="10" fill="#8D66FF"/>
    <circle cx="64" cy="0" r="10" fill="#F3A23A"/><circle cx="96" cy="0" r="10" fill="#25C58B"/>
    <circle cx="128" cy="0" r="10" fill="#50657F"/>
    <text x="150" y="4" class="t tiny muted">Dark / clean / professional</text>
  </g>

  <!-- helper screen cards -->
  <g id="screenShell">
    <rect width="600" height="290" rx="14" class="panel" filter="url(#shadow)"/>
    <rect width="110" height="290" rx="14" fill="#0A1728"/>
    <rect x="110" y="0" width="490" height="38" fill="#0D1E31"/>
    <circle cx="568" cy="19" r="10" fill="#2E8BFF"/>
    <rect x="126" y="10" width="220" height="18" rx="8" fill="#152A42"/>
    <rect x="14" y="18" width="74" height="9" rx="4" fill="#E8F0FA" opacity=".9"/>
    <rect x="14" y="50" width="82" height="20" rx="6" fill="#19395E"/>
    <rect x="14" y="78" width="76" height="8" rx="4" fill="#71849E"/>
    <rect x="14" y="101" width="76" height="8" rx="4" fill="#71849E"/>
    <rect x="14" y="124" width="76" height="8" rx="4" fill="#71849E"/>
    <rect x="14" y="160" width="48" height="7" rx="4" fill="#50657F"/>
    <rect x="14" y="184" width="76" height="8" rx="4" fill="#71849E"/>
    <rect x="14" y="207" width="76" height="8" rx="4" fill="#71849E"/>
