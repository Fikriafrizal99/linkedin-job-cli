    <rect x="136" y="118" width="100" height="22" rx="7" fill="#1C4775"/>
    <g fill="#8799B2"><rect x="136" y="151" width="82" height="7" rx="3"/><rect x="136" y="173" width="82" height="7" rx="3"/><rect x="136" y="195" width="82" height="7" rx="3"/><rect x="136" y="217" width="82" height="7" rx="3"/></g>
    <text x="272" y="128" class="t small">General Settings</text>
