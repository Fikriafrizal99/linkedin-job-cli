      <rect x="14" y="118" width="80" height="20" rx="7" fill="#18324D"/><rect x="168" y="118" width="80" height="20" rx="7" fill="#18324D"/><rect x="322" y="118" width="98" height="20" rx="7" fill="#18324D"/>
