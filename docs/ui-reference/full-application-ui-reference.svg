      <line x1="126" y1="166" x2="584" y2="166"/><line x1="126" y1="188" x2="584" y2="188"/>
      <line x1="126" y1="210" x2="584" y2="210"/><line x1="126" y1="232" x2="584" y2="232"/><line x1="126" y1="254" x2="584" y2="254"/>
